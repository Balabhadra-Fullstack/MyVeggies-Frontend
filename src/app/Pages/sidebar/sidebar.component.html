<div class="sidebar" [class.collapsed]="collapsed">

  <!-- =========================
       TOP
  ========================== -->

    <div class="logo">
      🌿 <span>NCM</span>
    </div>

    <button class="menu-btn" (click)="toggleSidebar()">

    </button>

  </div>


  <!-- =========================

  ========================== -->

      routerLinkActive="active">

          routerLink="/editSale"

        </a>

        </a>

      routerLink="/reports"
      routerLinkActive="active">
