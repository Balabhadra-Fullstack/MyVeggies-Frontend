<div class="payment-page">
  <div class="payment-card">
    <div class="payment-header">
      <div class="header-icon">
        <i class="bi bi-wallet2"></i>
      </div>

      <div>
        <h2>Supplier Payment</h2>
        <p>Record and manage supplier payments</p>
      </div>
    </div>

    <div class="form-divider"></div>

    <div class="form-group">
      <label>
        <i class="bi bi-person me-1"></i>
        Supplier Name
      </label>

      <div class="supplier-search">
        <div class="search-input-wrapper">
          <i class="bi bi-search search-icon"></i>

          <input
            type="text"
            class="form-control search-input"
            [(ngModel)]="supplierSearch"
            (input)="searchSupplier()"
            placeholder="Search supplier by name..."
            autocomplete="off"
          />

          <button
            type="button"
            class="clear-search"
            *ngIf="supplierSearch"
            (click)="supplierSearch = ''; payment.id = null; filteredSuppliers = []; showSupplierDropdown = false"
            aria-label="Clear supplier search">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>

        <div class="supplier-dropdown" *ngIf="showSupplierDropdown">
          <div
            class="supplier-option"
            *ngFor="let supplier of filteredSuppliers"
            (click)="selectSupplier(supplier)">
            <div class="supplier-avatar">
              <i class="bi bi-person"></i>
            </div>

            <div class="supplier-info">
              <span class="supplier-name">{{ supplier.name }}</span>
              <small>Supplier Number: {{ supplier.mobileNumber }}</small>
            </div>

            <i class="bi bi-arrow-up-left select-icon"></i>
          </div>

          <div class="no-result" *ngIf="filteredSuppliers.length === 0">
            <i class="bi bi-person-exclamation"></i>
            <span>No supplier found</span>
          </div>
        </div>
      </div>

      <small class="field-hint" *ngIf="payment.id">
        <i class="bi bi-check-circle-fill"></i>
        Supplier selected successfully
      </small>
    </div>

    <div class="form-group">
      <label>
        <i class="bi bi-currency-rupee me-1"></i>
        Payment Amount
      </label>

      <div class="input-wrapper">
        <span class="input-prefix">₹</span>
        <input
          type="number"
          class="form-control prefixed-input"
          [(ngModel)]="payment.paymentamount"
          placeholder="Enter payment amount"
          min="0.01"
          step="0.01"
        />
      </div>
    </div>

    <div class="form-group">
      <label>
        <i class="bi bi-credit-card me-1"></i>
        Payment Method
      </label>

      <select class="form-control" [(ngModel)]="payment.paymentmethod">
        <option value="">Select payment method</option>
        <option value="CASH">Cash</option>
        <option value="UPI">UPI</option>
        <option value="BANK">Bank Transfer</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <i class="bi bi-calendar3 me-1"></i>
        Payment Date
      </label>

      <input
        type="date"
        class="form-control"
        [(ngModel)]="payment.paymenttime"
      />
    </div>

    <button type="button" class="btn-payment" (click)="savePayment()">
      <i class="bi bi-check-circle me-2"></i>
      Save Payment
    </button>

    <p class="footer-note">
      <i class="bi bi-shield-check me-1"></i>
      Please verify payment details before saving.
    </p>
  </div>
</div>
