<div class="report-page">

  <!-- =========================
       HEADER
  ========================== -->
  <div class="page-header">

    <div>
      <h2>
        <i class="bi bi-file-earmark-bar-graph me-2"></i>
        Reports
      </h2>

      <p>
        Generate purchase and sale reports
      </p>
    </div>

  </div>


  <!-- =========================
       REPORT CARD
  ========================== -->
  <div class="report-card">

    <!-- PARTY TYPE -->
    <div class="report-section">

      <h6 class="section-title">
        <i class="bi bi-people me-2"></i>
        Select Report Type
      </h6>


      <div class="type-buttons">

        <button
          type="button"
          class="type-btn"
          [class.active]="reportType === 'supplier'"
          (click)="selectReportType('supplier')"
        >
          <i class="bi bi-truck me-2"></i>
          Supplier
        </button>


        <button
          type="button"
          class="type-btn"
          [class.active]="reportType === 'customer'"
          (click)="selectReportType('customer')"
        >
          <i class="bi bi-person me-2"></i>
          Customer
        </button>

      </div>

    </div>


    <!-- =========================
         SUPPLIER OPTIONS
    ========================== -->
    <div
      class="report-section"
      *ngIf="reportType === 'supplier'"
    >

      <h6 class="section-title">
        <i class="bi bi-box-seam me-2"></i>
        Supplier Report
      </h6>


      <div class="type-buttons">

        <button
          type="button"
          class="type-btn"
          [class.active]="supplierReportType === 'normal'"
          (click)="supplierReportType = 'normal'"
        >
          <i class="bi bi-cart me-2"></i>
          Normal Purchase
        </button>


        <button
          type="button"
          class="type-btn"
          [class.active]="supplierReportType === 'commission'"
          (click)="supplierReportType = 'commission'"
        >
          <i class="bi bi-percent me-2"></i>
          Commission Purchase
        </button>

      </div>

    </div>


    <!-- =========================
         CUSTOMER OPTIONS
    ========================== -->
    <div
      class="report-section"
      *ngIf="reportType === 'customer'"
    >

      <h6 class="section-title">
        <i class="bi bi-cart-check me-2"></i>
        Customer Report
      </h6>

      <div class="selected-report">
        <i class="bi bi-check-circle-fill"></i>
        Sale Report
      </div>

    </div>


    <!-- =========================
         PARTY SEARCH
    ========================== -->
   <div class="report-section">

  <h6 class="section-title">

    <!-- Supplier Icon -->
    <i
      *ngIf="reportType === 'supplier'"
      class="bi bi-truck me-2"
    ></i>

    <!-- Customer Icon -->
    <i
      *ngIf="reportType === 'customer'"
      class="bi bi-person me-2"
    ></i>


    <!-- Title -->
    <span *ngIf="reportType === 'supplier'">
      Search Supplier
    </span>

    <span *ngIf="reportType === 'customer'">
      Search Customer
    </span>

  </h6>


  <!-- Search Box -->
  <div class="search-box">

    <i class="bi bi-search"></i>

    <input
      type="text"
      class="form-control"
      [placeholder]="
        reportType === 'supplier'
          ? 'Search supplier...'
          : 'Search customer...'
      "
      [(ngModel)]="partySearchText"
      (input)="searchParty()"
    >

  </div>


  <!-- Search Results -->
  <div
    class="search-results"
    *ngIf="filteredParties.length > 0"
  >

    <div
      class="search-result"
      *ngFor="let party of filteredParties"
      (click)="selectParty(party)"
    >

      <strong>
        {{ party.name }}
      </strong>

      <small *ngIf="party.mobileNumber">
        {{ party.mobileNumber }}
      </small>

    </div>

  </div>

</div>


    <!-- =========================
         DATE FILTER
    ========================== -->
    <div class="report-section">

      <h6 class="section-title">
        <i class="bi bi-calendar-range me-2"></i>
        Date Range
      </h6>


      <div class="row g-3">

        <div class="col-md-6">

          <label class="form-label">
            From Date
          </label>

          <input
            type="date"
            class="form-control"
            [(ngModel)]="fromDate"
          >

        </div>


        <div class="col-md-6">

          <label class="form-label">
            To Date
          </label>

          <input
            type="date"
            class="form-control"
            [(ngModel)]="toDate"
          >

        </div>

      </div>

    </div>


    <!-- =========================
         ACTIONS
    ========================== -->
    <div class="report-actions">

      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="resetReport()"
      >
        <i class="bi bi-arrow-counterclockwise me-1"></i>
        Reset
      </button>


      <button
        type="button"
        class="btn btn-primary"
        (click)="generateWordReport()"
      >
        <i class="bi bi-file-earmark-word me-1"></i>
        Generate Word
      </button>


      <button
        type="button"
        class="btn btn-success"
        (click)="exportExcel()"
      >
        <i class="bi bi-file-earmark-excel me-1"></i>
        Export Excel
      </button>

    </div>

  </div>

</div>
