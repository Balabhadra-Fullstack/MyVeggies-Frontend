<div class="sale-history">

  <div class="page-header">

    <h2>Sale History</h2>

    <div class="date-filter">

      <label for="saleDate">
        Select Date
      </label>

      <input
        id="saleDate"
        type="date"
        (change)="getSalesByDate()"
      />

    </div>

  </div>


  <!-- Sales Found -->
  <div
    *ngIf="sales.length > 0"
    class="sale-table"
  >

    <table>

      <thead>

        <tr>
          <th>Customer</th>
          <th>Items</th>
          <th>Total Amount</th>
          <th>Action</th>
        </tr>

      </thead>


      <tbody>

        <tr *ngFor="let sale of sales">

          <!-- Customer -->
          <td>
            {{ sale.customer.name }}
          </td>


          <!-- Items -->
          <td>

            <span
              *ngFor="let item of sale.saleItems"
              class="item-text"
            >
              {{ item.vegetable.name }}
              ({{ item.kg }} kg)
            </span>

          </td>


          <!-- Total -->
          <td>
            ₹{{ sale.netAmount }}
          </td>


          <!-- Action -->
          <td>

            <button
              type="button"
              class="edit-btn"
              (click)="editSale(sale.id)"
            >
              Edit
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- No Sales -->
  <div
    *ngIf="sales.length === 0"
    class="no-sale"
  >

    <div class="empty-icon">
      📦
    </div>

    <h3>No Sales</h3>

    <p>
      No sales found for this date.
    </p>

  </div>

</div>
